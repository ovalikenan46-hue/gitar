name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, capacity-hardening-50k-5k]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORT: "10000"
      BASE_PATH: "/"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm run build
